name: Questionnaire E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1-5"

permissions:
  contents: read

concurrency:
  group: questionnaire-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.34"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: solution/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: bun install

      - name: Type-check backend
        working-directory: backend
        run: bunx tsc --noEmit

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install test dependencies
        working-directory: solution
        run: npm ci

      - name: Validate configuration and discover tests
        working-directory: solution
        run: npm run check

  e2e:
    name: Run full-stack Playwright tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.34"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: solution/package-lock.json

      - name: Start databases
        run: docker compose up -d postgres qdrant

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..60}; do
            if docker compose exec -T postgres pg_isready -U qa_user -d qa_task; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Wait for Qdrant
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:6333/readyz > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Install application dependencies
        working-directory: backend
        run: bun install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Migrate database
        working-directory: backend
        run: bun run migrate

      - name: Install test dependencies
        working-directory: solution
        run: npm ci

      - name: Install Chromium
        working-directory: solution
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: solution
        run: npm test
        env:
          CI: "true"
          APP_DIR: ".."

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            solution/playwright-report
            solution/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
